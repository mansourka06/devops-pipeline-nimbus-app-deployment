[jenkins]
jenkins-master ansible_host={{ jenkins_master_ip | default('CHANGE_ME') }} ansible_user=ubuntu

[k8s_bastion]
bastion ansible_host={{ bastion_ip | default('CHANGE_ME') }} ansible_user=ubuntu

[all:vars]
ansible_ssh_private_key_file=~/.ssh/nimbus-devops.pem
ansible_python_interpreter=/usr/bin/python3
