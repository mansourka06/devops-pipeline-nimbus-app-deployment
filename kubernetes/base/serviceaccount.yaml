apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbus
  annotations:
    # Remplacé par le rôle IRSA réel (sortie Terraform "app_role_arn").
    # Permet aux pods d'assumer un rôle IAM sans clé statique.
    eks.amazonaws.com/role-arn: "arn:aws:iam::CHANGE_ME_ACCOUNT_ID:role/nimbus-dev-nimbus-app-role"
