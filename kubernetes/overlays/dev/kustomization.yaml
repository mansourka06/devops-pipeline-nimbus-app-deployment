apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nimbus-dev

resources:
  - ../../base

patches:
  - path: patch-deployment.yaml

images:
  - name: CHANGE_ME_ECR_REPO_URL
    newName: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/nimbus-dev
    newTag: dev

commonLabels:
  environment: dev
